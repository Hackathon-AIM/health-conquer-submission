# A/B: 응급 시 검색을 우회할 것인가
#
# ⚠️ '검색 우회'는 HealthBench가 규정한 게 아니라 우리 설계 가설이다.
#    근거가 확실한 것은 배치 점수뿐:
#      응급 안내 맨 앞 +10 / 뒤에 묻으면 -9 / 감별진단 나열 -5
#
#    우회 논거: 검색 결과가 컨텍스트에 있으면 모델이 그걸 쓰려 해서
#               "가능한 원인으로는 A, B, C" 가 나오고 그게 -5다.
#    반론    : 가이드라인에 "이런 흉통은 즉시 119" 같은 구체적 조치가 있고,
#               감별진단 나열은 템플릿으로도 막을 수 있다.
#
#    → 응급 테마 문항만 뽑아서 세 설정을 비교할 것.
#      (전체 문항으로 재면 응급이 10%뿐이라 차이가 묻힌다)
name: emergency_bypass
retrieval:
  mode: mock
emergency:
  sources: []
