# ★ 넘어야 할 베이스라인 — 파이프라인 없이 모델에 그대로 묻는다.
#
# L1-16B-A3B 는 HealthBench-Consensus 93.50% 를 이미 낸다.
# 우리 파이프라인(RAG · 게이트 · 비평)이 이 숫자를 넘는지 반드시 확인해야 한다.
#
# 넘지 못하면 = 파이프라인이 노이즈를 넣고 있다는 뜻이다. 가능한 원인:
#   · 검색 결과가 관련 없는 내용을 끌고 들어옴
#   · 경고 삽입이 과해서 관련성 항목이 깎임
#   · 템플릿 강제가 모델의 자연스러운 서술을 망침
#
#   make ab-baseline   # l1_raw vs l1 비교

name: l1_raw_baseline

llm:
  base_url: "http://localhost:9006/v1"
  api_key_env: MEDAI_API_KEY
  timeout: 60.0
  max_tokens: 2048
  context_window: 32768
  strip_think: true

models:
  drafter: learning-unit/L1-16B-A3B
  grader:  gpt-4.1

layers:
  passthrough: true          # ← 파이프라인 전체 off
