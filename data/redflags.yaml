# 레드플래그 패턴 — L1 결정론적 스크리너
#
# ⚠️ 이 파일은 임시 시드다. 8/21 오전에 D가 반드시 교체할 것.
#
# 만드는 법 (창작 금지):
#   1. openai/simple-evals 의 HealthBench 데이터를 받는다
#   2. theme == "emergency_referral" 인 예시를 전부 뽑는다
#   3. 루브릭에 "응급 의뢰/연락" 가점 항목이 걸린 대화의 '사용자 발화'를 모은다
#   4. 거기서 공통 증상 표현을 정규식으로 정리한다
#   5. KoMGI 진료지침의 "즉시 내원" 문구로 보강한다
#
# 의사 262명이 표시해둔 것을 옮기는 것이므로,
# 의료 배경 없이도 정확도가 보장되는 유일한 경로다.
#
# ⚠️ OpenAI가 학습 데이터 오염 방지를 위해 예시를 온라인에 평문 공개하지 말 것을
#    요청하고 있으므로, 이 파일은 저장소 밖으로 유출하지 말 것.

cardiac:
  - '가슴이?\s*(조이|짓눌|찢어|답답|아프|아파)'
  - '식은땀.{0,12}(가슴|흉통)'
  - '(왼쪽|좌측)?\s*팔.{0,6}(저림|저려).{0,12}가슴'
  - '흉통'
  - '가슴.{0,6}(쥐어짜|누르는)'

neuro:
  - '갑자기.{0,12}(말이\s*어눌|발음이\s*이상|한쪽.{0,4}(마비|힘이\s*빠))'
  - '(지금까지|평생|난생).{0,10}(가장|제일)\s*심한\s*두통'
  - '벼락(같은)?\s*두통'
  - '의식.{0,4}(잃|없|흐)'
  - '경련|발작'
  - '한쪽\s*(얼굴|입).{0,6}(처지|돌아)'

respiratory:
  - '숨을?\s*(못|잘\s*못)\s*(쉬|쉬겠)'
  - '호흡\s*곤란'
  - '입술이?\s*(파래|퍼레|창백)'
  - '숨이?\s*(턱|넘어)'

bleeding:
  - '피를?\s*토'
  - '검은\s*변|흑색변'
  - '멈추지\s*않는\s*출혈|지혈이?\s*안'
  - '대량\s*출혈'

psych:
  - '죽고\s*싶'
  - '살기\s*싫'
  - '자살'
  - '해치고\s*싶'
  - '사라지고\s*싶'

anaphylaxis:
  - '목이?\s*(붓|조이|막히)'
  - '온몸에?\s*두드러기.{0,12}(숨|호흡)'
  - '얼굴이?\s*(붓|부어).{0,10}(숨|호흡)'

abdominal:
  - '배가?\s*(찢어질|칼로|참을\s*수\s*없)'
  - '복부.{0,6}(강직|판자)'
